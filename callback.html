<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ski Planner · connecting</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e8eef7;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.box{max-width:420px}
a.btn,button{display:inline-block;margin:10px 4px;padding:12px 18px;border-radius:12px;border:1px solid #4d74bd;background:#2b4472;color:#fff;text-decoration:none;font:inherit;font-weight:600}
code{display:block;margin:10px 0;padding:10px;border-radius:10px;background:#141e30;border:1px solid #283954;word-break:break-all;font-size:14px}
.sub{color:#91a1b9;font-size:14px}
</style>
</head>
<body>
<div class="box" id="box">Connecting…</div>
<script>
(function(){
  var q=new URLSearchParams(location.search), code=q.get("code"), state=q.get("state")||"", err=q.get("error");
  var box=document.getElementById("box");
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  if(err||!code){box.innerHTML="<h2>Not connected</h2><p class='sub'>"+esc(err||"No authorization code was returned.")+" Close this page and try Connect again in Ski Planner.</p>";return;}
  var qs="code="+encodeURIComponent(code)+"&state="+encodeURIComponent(state);
  var codeHtml="<p class='sub'>If the app didn't pick it up, copy this code and paste it into Ski Planner (Stats → Connections):</p><code id='c'>"+esc(code)+"</code><button id='cp'>Copy code</button>";
  if(state.indexOf("native-")===0){
    var deep="skiplanner://oauth?"+qs;
    box.innerHTML="<h2>Almost done</h2><p>Returning to Ski Planner…</p><a class='btn' href='"+deep+"'>Open Ski Planner</a>"+codeHtml;
    setTimeout(function(){location.href=deep;},300);
  }else{
    box.innerHTML="<h2>Almost done</h2><p>Returning to Ski Planner…</p>"+codeHtml;
    setTimeout(function(){location.replace("./?"+qs);},600);
  }
  var cp=document.getElementById("cp");
  if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(code);cp.textContent="Copied ✓";}catch(e){}};
})();
</script>
</body>
</html>
